<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Exact causal path through the v10 one-pin QPSK transmitter</title>
  <desc id="desc">PRBS16 QPSK becomes a complex lane waveform, two signed one-bit sigma-delta streams, a whole-word 7.5 megahertz phase rotation, selection among four 216 megahertz phases, a pMOS-switched N16 output, the resonant tank, a three decibel pad, and the RTL-SDR receiver.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#44616f"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10242e" flood-opacity=".12"/></filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#132630}.h{font-size:31px;font-weight:750}.s{font-size:22px}.n{font-size:19px;fill:#526873}.box{rx:24;filter:url(#shadow);stroke-width:3}.a{stroke:#44616f;stroke-width:5;fill:none;marker-end:url(#arrow)}.chip{fill:#eaf5fb;stroke:#1479b8}.logic{fill:#e9f7f3;stroke:#008c72}.clock{fill:#fff4e8;stroke:#e86d00}.pin{fill:#fbeaf1;stroke:#c03f70}.matter{fill:#f4f0ff;stroke:#7257b5}.instrument{fill:#edf1f4;stroke:#526873}
    </style>
  </defs>
  <rect width="1800" height="760" fill="#fbfcfc"/>
  <text x="70" y="72" class="t h">The complete complex signal is formed before one FPGA pad touches the tank</text>
  <text x="70" y="112" class="t n">Measured v10 path · one FPGA-native PRBS16 QPSK lane · no external DAC or quadrature mixer at the RF boundary</text>

  <rect x="55" y="205" width="210" height="190" class="box chip"/>
  <text x="160" y="260" text-anchor="middle" class="t h">PRBS16</text>
  <text x="160" y="301" text-anchor="middle" class="t s">seed 0x1D2B</text>
  <text x="160" y="340" text-anchor="middle" class="t s">lane 62 → QPSK</text>

  <path d="M265 300H325" class="a"/>
  <rect x="325" y="205" width="235" height="190" class="box logic"/>
  <text x="442" y="254" text-anchor="middle" class="t h">Complex lane</text>
  <text x="442" y="298" text-anchor="middle" class="t s">32 phase samples</text>
  <text x="442" y="338" text-anchor="middle" class="t s">signed I and Q</text>

  <path d="M560 300H620" class="a"/>
  <rect x="620" y="205" width="235" height="190" class="box logic"/>
  <text x="737" y="254" text-anchor="middle" class="t h">Two SDMs</text>
  <text x="737" y="298" text-anchor="middle" class="t s">signed first order</text>
  <text x="737" y="338" text-anchor="middle" class="t s">I bit + Q bit</text>

  <path d="M855 300H915" class="a"/>
  <rect x="915" y="205" width="235" height="190" class="box clock"/>
  <text x="1032" y="250" text-anchor="middle" class="t h">+7.5 MHz</text>
  <text x="1032" y="294" text-anchor="middle" class="t s">whole-word rotation</text>
  <text x="1032" y="336" text-anchor="middle" class="t s">Gray quadrant DDS</text>

  <path d="M1150 300H1210" class="a"/>
  <rect x="1210" y="205" width="235" height="190" class="box clock"/>
  <text x="1327" y="250" text-anchor="middle" class="t h">Four phases</text>
  <text x="1327" y="294" text-anchor="middle" class="t s">216 MHz PLL</text>
  <text x="1327" y="336" text-anchor="middle" class="t s">0° · 90° · 180° · 270°</text>

  <path d="M1445 300H1505" class="a"/>
  <rect x="1505" y="205" width="240" height="190" class="box pin"/>
  <text x="1625" y="250" text-anchor="middle" class="t h">N16</text>
  <text x="1625" y="294" text-anchor="middle" class="t s">pMOS switch</text>
  <text x="1625" y="336" text-anchor="middle" class="t s">high / high-Z</text>

  <path d="M1625 395V470H1240" class="a"/>
  <rect x="1020" y="470" width="220" height="160" class="box matter"/>
  <text x="1130" y="527" text-anchor="middle" class="t h">Resonant tank</text>
  <text x="1130" y="571" text-anchor="middle" class="t s">measured loaded Q</text>

  <path d="M1020 550H935" class="a"/>
  <rect x="735" y="470" width="200" height="160" class="box matter"/>
  <text x="835" y="527" text-anchor="middle" class="t h">3 dB pad</text>
  <text x="835" y="571" text-anchor="middle" class="t s">receiver input</text>

  <path d="M735 550H650" class="a"/>
  <rect x="380" y="470" width="270" height="160" class="box instrument"/>
  <text x="515" y="527" text-anchor="middle" class="t h">RTL-SDR Blog V4</text>
  <text x="515" y="571" text-anchor="middle" class="t s">2.4 MS/s complex I/Q</text>

  <path d="M380 550H295" class="a"/>
  <rect x="55" y="470" width="240" height="160" class="box instrument"/>
  <text x="175" y="523" text-anchor="middle" class="t h">Receiver</text>
  <text x="175" y="566" text-anchor="middle" class="t s">carrier + timing</text>
  <text x="175" y="598" text-anchor="middle" class="t s">symbol decisions</text>

  <text x="70" y="704" class="t n">The tank is part of the transmitter. The RTL-SDR begins only after the nominal 3 dB pad.</text>
</svg>
