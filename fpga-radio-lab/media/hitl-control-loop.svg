<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Hardware-in-the-loop control cycle for the FPGA radio campaign</title>
  <desc id="desc">Brian chooses a bounded physical question. The laboratory changes one variable, synthesizes and routes the FPGA, arms telemetry and the receiver, programs volatile CRAM, transmits one bounded burst, compares live logic with received RF and message recovery, then retains or rejects the change and chooses the next question.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46616e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10242e" flood-opacity=".11"/></filter>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#132630}.h{font-size:32px;font-weight:760}.s{font-size:22px}.n{font-size:19px;fill:#526873}.box{rx:24;filter:url(#shadow);stroke-width:3}.a{fill:none;stroke:#46616e;stroke-width:5;marker-end:url(#arrow)}.human{fill:#eaf5fb;stroke:#1479b8}.build{fill:#e9f7f3;stroke:#008c72}.physical{fill:#fff4e8;stroke:#e86d00}.measure{fill:#f4f0ff;stroke:#7257b5}.decision{fill:#fbeaf1;stroke:#c03f70}.rail{fill:#edf1f4;stroke:#526873}</style>
  </defs>
  <rect width="1800" height="980" fill="#fbfcfc"/>
  <text x="70" y="72" class="t h">One physical question travels through RTL, silicon, matter, and back again</text>
  <text x="70" y="112" class="t n">Response-driven loops chose the next one-variable discriminator; fixed sweeps and repeats followed predetermined instrument mechanics.</text>

  <rect x="70" y="190" width="330" height="150" class="box human"/>
  <text x="235" y="245" text-anchor="middle" class="t h">Choose the question</text>
  <text x="235" y="289" text-anchor="middle" class="t s">Brian sets the mechanism,</text>
  <text x="235" y="320" text-anchor="middle" class="t s">boundary, and safe variable</text>

  <path d="M400 265H500" class="a"/>
  <rect x="500" y="190" width="300" height="150" class="box build"/>
  <text x="650" y="245" text-anchor="middle" class="t h">Rebuild</text>
  <text x="650" y="289" text-anchor="middle" class="t s">Yosys → nextpnr</text>
  <text x="650" y="320" text-anchor="middle" class="t s">timing gate → Icepack</text>

  <path d="M800 265H900" class="a"/>
  <rect x="900" y="190" width="320" height="150" class="box measure"/>
  <text x="1060" y="245" text-anchor="middle" class="t h">Arm observation</text>
  <text x="1060" y="289" text-anchor="middle" class="t s">direct FPGA telemetry</text>
  <text x="1060" y="320" text-anchor="middle" class="t s">and RTL-SDR already running</text>

  <path d="M1220 265H1320" class="a"/>
  <rect x="1320" y="190" width="400" height="150" class="box physical"/>
  <text x="1520" y="245" text-anchor="middle" class="t h">Load volatile CRAM</text>
  <text x="1520" y="289" text-anchor="middle" class="t s">verify CDONE, then permit</text>
  <text x="1520" y="320" text-anchor="middle" class="t s">one bounded physical burst</text>

  <path d="M1520 340V455" class="a"/>
  <rect x="1320" y="455" width="400" height="165" class="box physical"/>
  <text x="1520" y="510" text-anchor="middle" class="t h">Cross the RF boundary</text>
  <text x="1520" y="554" text-anchor="middle" class="t s">N16 → tank → pad</text>
  <text x="1520" y="588" text-anchor="middle" class="t s">→ independent RTL-SDR clock</text>

  <path d="M1320 537H1220" class="a"/>
  <rect x="860" y="455" width="360" height="165" class="box measure"/>
  <text x="1040" y="510" text-anchor="middle" class="t h">Recover consequences</text>
  <text x="1040" y="554" text-anchor="middle" class="t s">spectrum + constellation</text>
  <text x="1040" y="588" text-anchor="middle" class="t s">message + live logic state</text>

  <path d="M860 537H760" class="a"/>
  <rect x="420" y="455" width="340" height="165" class="box decision"/>
  <text x="590" y="510" text-anchor="middle" class="t h">Retain or reject</text>
  <text x="590" y="554" text-anchor="middle" class="t s">a prettier spectrum loses</text>
  <text x="590" y="588" text-anchor="middle" class="t s">if the message is wrong</text>

  <path d="M420 537H250V340" class="a"/>

  <rect x="70" y="720" width="1650" height="150" class="box rail"/>
  <text x="120" y="775" class="t h">Safety stays below every branch</text>
  <text x="120" y="821" class="t s">N16 high-impedance outside the burst</text>
  <text x="590" y="821" class="t s">• PLL or reset loss vetoes RF</text>
  <text x="1020" y="821" class="t s">• TX LED follows the real gate</text>
  <text x="1420" y="821" class="t s">• idle postflight</text>
  <text x="70" y="930" class="t n">The laboratory ran across July 25 and 26. Capture files include RF-off guards; they are not continuous-transmission time.</text>
</svg>
