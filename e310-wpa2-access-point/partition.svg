<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">From a C++ packet to a radio client</title><desc id="desc">Four processing blocks divide the AP by timing. Windows and ARM exchange frames, the FPGA owns immediate response, and the SDR frontend exchanges I/Q with the FPGA.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#78e4b7" stroke-width="1.5"/></marker></defs><rect width="1120" height="660" fill="#0b1c25"/><g font-family="Arial,sans-serif" fill="#e6f3f3"><text x="44" y="48" font-size="26" font-weight="700">The immediate reply stays on the radio side.</text><g fill="#14303a" stroke="#31515a" stroke-width="2"><rect x="44" y="82" width="610" height="155" rx="8"/><rect x="44" y="312" width="265" height="140" rx="8"/><rect x="384" y="312" width="330" height="240" rx="8"/><rect x="799" y="312" width="277" height="140" rx="8"/></g><text x="68" y="119" font-size="23" font-weight="700">Windows / portable C++</text><text x="68" y="155" font-size="19">Association → WPA2 keys → CCMP → IP → HTTP</text><text x="68" y="187" font-size="19">Ordinary transmit waveform construction</text><text x="68" y="215" font-size="17" fill="#a8c1c8">RX frame assembly · counters · retry and power-save state</text><text x="66" y="347" font-size="22" font-weight="700">ARM adapter</text><text x="66" y="382" font-size="18">Packet framing / FIFO I/O</text><text x="66" y="413" font-size="18">Health lease / RF stop</text><text x="408" y="347" font-size="22" font-weight="700">FPGA response engine</text><text x="408" y="382" font-size="18">I/Q → DSSS RX → FCS</text><text x="408" y="413" font-size="18">Classifier → local ACK / CTS</text><text x="408" y="444" font-size="18">Ordinary waveform playback</text><text x="408" y="495" font-size="21" fill="#78e4b7" font-weight="700">10 µs loop stays here</text><text x="408" y="528" font-size="17" fill="#a8c1c8">No Windows or UART round trip</text><text x="820" y="347" font-size="22" font-weight="700">RF frontend</text><text x="820" y="382" font-size="18">AD9361 on the E310</text><text x="820" y="413" font-size="18">RX samples / TX samples</text><g stroke="#78e4b7" stroke-width="3" fill="none" marker-start="url(#a)" marker-end="url(#a)"><path d="M176 241V307"/><path d="M315 382H377"/><path d="M721 382H792"/><path d="M938 459V535"/></g><text x="200" y="278" font-size="17" fill="#78e4b7">GFAP / UART 460800 baud</text><text x="737" y="362" font-size="16">I/Q</text><text x="961" y="501" font-size="17" fill="#78e4b7">AIR</text><rect x="799" y="542" width="277" height="67" rx="8" fill="#214737"/><text x="826" y="583" font-size="22" font-weight="700">Wi-Fi station → HTML</text><text x="44" y="610" font-size="18" fill="#a8c1c8">Windows builds packets. The FPGA closes the frame-to-ACK path.</text></g></svg>
