<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="title desc"><title id="title">From frame bytes to the 1 Mb/s waveform</title><desc id="desc">One information bit becomes one 1 µs symbol: 11 spreading chips, represented by 20 I/Q samples.</desc><style>text{font-family:Arial,sans-serif;fill:#161616}.title{font-size:30px;font-weight:bold}.sub{font-size:20px}.label{font-size:23px;font-weight:bold}.field{font-size:21px}.count{font-size:19px;fill:#542800}</style><rect width="1120" height="660" fill="#fff"/><text class="title" x="30" y="44">From frame bytes to the 1 Mb/s waveform</text><text class="sub" x="30" y="77">One information bit becomes one 1 µs symbol: 11 spreading chips, represented by 20 I/Q samples.</text><text class="label" x="30" y="116">Complete long-preamble physical transmission</text><rect x="30" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="159">Training</text><text class="count" x="42" y="187">128 bits</text><rect x="295" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="159">Delimiter</text><text class="count" x="307" y="187">16 bits</text><rect x="560" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="159">PHY header</text><text class="count" x="572" y="187">48 bits</text><rect x="825" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="159">MAC + FCS</text><text class="count" x="837" y="187">8 × N bits</text><text class="label" x="30" y="248">Six-byte physical header</text><rect x="30" y="261" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="291">SIGNAL 0A</text><text class="count" x="42" y="319">1 byte</text><rect x="295" y="261" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="291">SERVICE 00</text><text class="count" x="307" y="319">1 byte</text><rect x="560" y="261" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="291">LENGTH = 8N</text><text class="count" x="572" y="319">2 bytes, low first</text><rect x="825" y="261" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="291">CRC16</text><text class="count" x="837" y="319">2 bytes, low first</text><text class="label" x="30" y="380">Bit-to-waveform operations</text><rect x="30" y="393" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="423">Scramble</text><text class="count" x="42" y="451">seven-bit state</text><rect x="295" y="393" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="423">Differential phase</text><text class="count" x="307" y="451">phase XOR bit</text><rect x="560" y="393" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="423">Barker signs</text><text class="count" x="572" y="451">11-chip pattern</text><rect x="825" y="393" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="423">Sample mapping</text><text class="count" x="837" y="451">floor(11s / 20)</text><text class="label" x="30" y="512">Each output sample</text><rect x="30" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="555">Choose polarity</text><text class="count" x="42" y="583">Barker sign XOR phase</text><rect x="383.3333333333333" y="525" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="555">I = +8192 or −8192</text><text class="count" x="395.3333333333333" y="583">signed 16-bit value</text><rect x="736.6666666666666" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="555">Q = 0</text><text class="count" x="748.6666666666666" y="583">signed 16-bit value</text></svg>
