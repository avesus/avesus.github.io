<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="1120" height="792" role="img" aria-labelledby="title desc"><title id="title">What encryption covers</title><desc id="desc">The outer FCS detects radio corruption; the keyed tag authenticates payload and selected header fields.</desc><style>text{font-family:Arial,sans-serif;fill:#161616}.title{font-size:30px;font-weight:bold}.sub{font-size:20px}.label{font-size:23px;font-weight:bold}.field{font-size:21px}.count{font-size:19px;fill:#542800}</style><rect width="1120" height="792" fill="#fff"/><text class="title" x="30" y="44">What encryption covers</text><text class="sub" x="30" y="77">The outer FCS detects radio corruption; the keyed tag authenticates payload and selected header fields.</text><text class="label" x="30" y="116">Protected ordinary data frame</text><rect x="30" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="159">MAC header</text><text class="count" x="42" y="187">24 readable bytes</text><rect x="295" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="159">CCMP header</text><text class="count" x="307" y="187">8 readable bytes</text><rect x="560" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="159">Ciphertext</text><text class="count" x="572" y="187">LLC + payload</text><rect x="825" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="159">Tag + FCS</text><text class="count" x="837" y="187">8 + 4 bytes</text><text class="label" x="30" y="248">CCMP header: 8 bytes</text><rect x="30" y="261" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="291">PN0 PN1</text><text class="count" x="42" y="319">low PN bytes</text><rect x="383.3333333333333" y="261" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="291">00, 20 | ID&lt;&lt;6</text><text class="count" x="395.3333333333333" y="319">reserved / key ID</text><rect x="736.6666666666666" y="261" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="291">PN2 PN3 PN4 PN5</text><text class="count" x="748.6666666666666" y="319">remaining PN bytes</text><text class="label" x="30" y="380">Nonce: 13 bytes</text><rect x="30" y="393" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="423">Priority</text><text class="count" x="42" y="451">1 byte</text><rect x="383.3333333333333" y="393" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="423">Transmitter</text><text class="count" x="395.3333333333333" y="451">6 bytes: Address 2</text><rect x="736.6666666666666" y="393" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="423">PN5 … PN0</text><text class="count" x="748.6666666666666" y="451">6 bytes, high first</text><text class="label" x="30" y="512">Ordinary AAD: 22 bytes</text><rect x="30" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="555">Masked control</text><text class="count" x="42" y="583">2 bytes</text><rect x="383.3333333333333" y="525" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="555">Addresses 1–3</text><text class="count" x="395.3333333333333" y="583">18 bytes</text><rect x="736.6666666666666" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="555">Fragment + zero</text><text class="count" x="748.6666666666666" y="583">2 bytes</text><text class="label" x="30" y="644">Plaintext dispatch</text><rect x="30" y="657" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="687">AA AA 03 00 00 00</text><text class="count" x="42" y="715">LLC / SNAP prefix</text><rect x="383.3333333333333" y="657" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="687">08 00 or 08 06</text><text class="count" x="395.3333333333333" y="715">IPv4 or ARP</text><rect x="736.6666666666666" y="657" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="687">Network message</text><text class="count" x="748.6666666666666" y="715">unencrypted inside CCM</text></svg>
