<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="title desc"><title id="title">Immediate and power-save control frames</title><desc id="desc">Frame Control values are shown as transmitted bytes. Lengths are bytes; fields are not to scale.</desc><style>text{font-family:Arial,sans-serif;fill:#161616}.title{font-size:30px;font-weight:bold}.sub{font-size:20px}.label{font-size:23px;font-weight:bold}.field{font-size:21px}.count{font-size:19px;fill:#542800}</style><rect width="1120" height="660" fill="#fff"/><text class="title" x="30" y="44">Immediate and power-save control frames</text><text class="sub" x="30" y="77">Frame Control values are shown as transmitted bytes. Lengths are bytes; fields are not to scale.</text><text class="label" x="30" y="116">ACK: 14 bytes</text><rect x="30" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="159">D4 00</text><text class="count" x="42" y="187">2</text><rect x="295" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="159">Duration = 0</text><text class="count" x="307" y="187">2</text><rect x="560" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="159">Receiver</text><text class="count" x="572" y="187">6</text><rect x="825" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="159">FCS</text><text class="count" x="837" y="187">4</text><text class="label" x="30" y="248">CTS: 14 bytes</text><rect x="30" y="261" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="291">C4 00</text><text class="count" x="42" y="319">2</text><rect x="295" y="261" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="291">Remaining time</text><text class="count" x="307" y="319">2</text><rect x="560" y="261" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="291">Receiver</text><text class="count" x="572" y="319">6</text><rect x="825" y="261" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="291">FCS</text><text class="count" x="837" y="319">4</text><text class="label" x="30" y="380">RTS: 20 bytes</text><rect x="30" y="393" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="423">B4 00 + duration</text><text class="count" x="42" y="451">2 + 2</text><rect x="295" y="393" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="423">Receiver</text><text class="count" x="307" y="451">6</text><rect x="560" y="393" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="423">Transmitter</text><text class="count" x="572" y="451">6</text><rect x="825" y="393" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="423">FCS</text><text class="count" x="837" y="451">4</text><text class="label" x="30" y="512">PS-Poll: 20 bytes</text><rect x="30" y="525" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="555">A4 00 + AID</text><text class="count" x="42" y="583">2 + 2</text><rect x="295" y="525" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="555">AP address</text><text class="count" x="307" y="583">6</text><rect x="560" y="525" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="555">Station address</text><text class="count" x="572" y="583">6</text><rect x="825" y="525" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="555">FCS</text><text class="count" x="837" y="583">4</text></svg>
