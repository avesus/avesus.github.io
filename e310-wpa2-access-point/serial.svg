<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="t d"><title id="t">A serial differential decision</title><desc id="d">I and Q signed products feed a serial adder. Data validity, phase and age are preserved through the fixed-latency graph.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#78e4b7" stroke-width="1.5"/></marker></defs><rect width="1120" height="410" fill="#0b1c25"/><g font-family="Arial,sans-serif" fill="#e6f3f3"><text x="44" y="48" font-size="26" font-weight="700">Re{current × conjugate(previous)}</text><g fill="#14303a" stroke="#31515a" stroke-width="2"><rect x="44" y="100" width="225" height="138" rx="7"/><rect x="344" y="100" width="215" height="60" rx="7"/><rect x="344" y="178" width="215" height="60" rx="7"/><rect x="644" y="130" width="170" height="86" rx="7"/><rect x="899" y="130" width="175" height="86" rx="7"/></g><text x="63" y="134" font-size="20">Signed 18-bit pairs</text><text x="63" y="176" font-size="18">Current / previous I</text><text x="63" y="211" font-size="18">Current / previous Q</text><text x="364" y="137" font-size="19">Serial I × I</text><text x="364" y="215" font-size="19">Serial Q × Q</text><text x="663" y="180" font-size="20">Serial sum</text><text x="920" y="168" font-size="20">Sign bit</text><text x="920" y="196" font-size="17">DBPSK decision</text><g stroke="#78e4b7" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M274 130H337"/><path d="M274 209H337"/><path d="M565 130H607V157H637"/><path d="M565 209H607V190H637"/><path d="M820 173H892"/></g><path d="M53 290H1067" stroke="#a8c1c8" stroke-width="3" stroke-dasharray="8 5"/><text x="55" y="328" font-size="20" fill="#a8c1c8">Metadata: validity + selected sample phase + elapsed-cycle age</text><text x="55" y="375" font-size="20" fill="#78e4b7">40 clocks per word at 40 MHz: one differential decision per microsecond.</text></g></svg>
