<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="1120" height="792" role="img" aria-labelledby="title desc"><title id="title">Four messages establish a pairwise key</title><desc id="desc">The flag words below are big-endian EAPOL values, not Wi-Fi Frame Control values.</desc><style>text{font-family:Arial,sans-serif;fill:#161616}.title{font-size:30px;font-weight:bold}.sub{font-size:20px}.label{font-size:23px;font-weight:bold}.field{font-size:21px}.count{font-size:19px;fill:#542800}</style><rect width="1120" height="792" fill="#fff"/><text class="title" x="30" y="44">Four messages establish a pairwise key</text><text class="sub" x="30" y="77">The flag words below are big-endian EAPOL values, not Wi-Fi Frame Control values.</text><text class="label" x="30" y="116">1. AP → station</text><rect x="30" y="129" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="159">Flags 008A</text><text class="count" x="42" y="187">no keyed check</text><rect x="383.3333333333333" y="129" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="159">Replay r</text><text class="count" x="395.3333333333333" y="187">8 bytes</text><rect x="736.6666666666666" y="129" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="159">ANonce</text><text class="count" x="748.6666666666666" y="187">32 bytes</text><text class="label" x="30" y="248">2. Station → AP</text><rect x="30" y="261" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="291">Flags 010A</text><text class="count" x="42" y="319">KCK check</text><rect x="383.3333333333333" y="261" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="291">Replay r</text><text class="count" x="395.3333333333333" y="319">same transaction</text><rect x="736.6666666666666" y="261" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="291">SNonce + RSN</text><text class="count" x="748.6666666666666" y="319">derive / verify PTK</text><text class="label" x="30" y="380">3. AP → station</text><rect x="30" y="393" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="423">Flags 13CA</text><text class="count" x="42" y="451">KCK check</text><rect x="383.3333333333333" y="393" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="423">Replay r + 1</text><text class="count" x="395.3333333333333" y="451">same ANonce</text><rect x="736.6666666666666" y="393" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="423">Wrapped key data</text><text class="count" x="748.6666666666666" y="451">RSN + GTK</text><text class="label" x="30" y="512">4. Station → AP</text><rect x="30" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="555">Flags 030A</text><text class="count" x="42" y="583">KCK check</text><rect x="383.3333333333333" y="525" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="555">Replay r + 1</text><text class="count" x="395.3333333333333" y="583">confirm install</text><rect x="736.6666666666666" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="555">Protected data</text><text class="count" x="748.6666666666666" y="583">may now proceed</text><text class="label" x="30" y="644">PTK: 48 bytes</text><rect x="30" y="657" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="687">KCK: 16</text><text class="count" x="42" y="715">check EAPOL</text><rect x="383.3333333333333" y="657" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="687">KEK: 16</text><text class="count" x="395.3333333333333" y="715">wrap key data</text><rect x="736.6666666666666" y="657" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="687">TK: 16</text><text class="count" x="748.6666666666666" y="715">protect data frames</text></svg>
