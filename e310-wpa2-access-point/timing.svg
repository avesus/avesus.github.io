<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="t d"><title id="t">SIFS is the start deadline</title><desc id="d">The radio frame ends before the software sees its bytes. A local age-aware scheduler starts ACK at SIFS. The complete ACK continues afterward. Diagram is conceptual, not a measured oscilloscope trace.</desc><rect width="1120" height="410" fill="#0b1c25"/><g font-family="Arial,sans-serif" fill="#e6f3f3"><text x="44" y="49" font-size="26" font-weight="700">Start ACK at 10 µs. Do not finish HTTP in 10 µs.</text><text x="44" y="87" font-size="17" fill="#a8c1c8">Conceptual timeline · not to scale · 40 MHz reference clock</text><path d="M54 164H1068" stroke="#66818a" stroke-width="2"/><rect x="54" y="133" width="220" height="62" fill="#355e72"/><text x="71" y="171" font-size="20">Incoming PPDU</text><path d="M274 110V330M690 110V270" stroke="#78e4b7" stroke-width="2" stroke-dasharray="5 5"/><rect x="690" y="133" width="378" height="62" fill="#246647"/><text x="712" y="171" font-size="20">ACK: 192 µs PHY + 112 µs MAC</text><text x="245" y="113" font-size="18">t = 0</text><text x="652" y="113" font-size="18">t = 10 µs</text><rect x="285" y="220" width="190" height="39" fill="#685b3a"/><rect x="475" y="220" width="215" height="39" fill="#254654"/><text x="299" y="247" font-size="17">Decode / prepare</text><text x="493" y="247" font-size="17">Remaining wait</text><text x="313" y="295" font-size="19" fill="#78e4b7">Age + fixed offset + wait = 400 radio clocks</text><path d="M55 343H1067" stroke="#9db1b9" stroke-width="3"/><text x="55" y="382" font-size="19" fill="#a8c1c8">Host independently processes frame → keys / IP / TCP → ordinary response</text></g></svg>
