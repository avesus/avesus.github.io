<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1056" width="1120" height="1056" role="img" aria-labelledby="title desc"><title id="title">Management frames: what follows the 24-byte header</title><desc id="desc">Lengths are bytes. Each complete frame ends with a four-byte FCS. Fields are not to scale.</desc><style>text{font-family:Arial,sans-serif;fill:#161616}.title{font-size:30px;font-weight:bold}.sub{font-size:20px}.label{font-size:23px;font-weight:bold}.field{font-size:21px}.count{font-size:19px;fill:#542800}</style><rect width="1120" height="1056" fill="#fff"/><text class="title" x="30" y="44">Management frames: what follows the 24-byte header</text><text class="sub" x="30" y="77">Lengths are bytes. Each complete frame ends with a four-byte FCS. Fields are not to scale.</text><text class="label" x="30" y="116">Beacon / probe response</text><rect x="30" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="159">Timestamp</text><text class="count" x="42" y="187">8</text><rect x="295" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="159">Interval</text><text class="count" x="307" y="187">2</text><rect x="560" y="129" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="159">Capability</text><text class="count" x="572" y="187">2</text><rect x="825" y="129" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="159">Elements</text><text class="count" x="837" y="187">variable</text><text class="label" x="30" y="248">Probe request</text><rect x="30" y="261" width="523" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="291">SSID element</text><text class="count" x="42" y="319">wildcard or named</text><rect x="560" y="261" width="523" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="572" y="291">Rates / other elements</text><text class="count" x="572" y="319">variable</text><text class="label" x="30" y="380">Authentication</text><rect x="30" y="393" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="423">Algorithm</text><text class="count" x="42" y="451">2: open = 0</text><rect x="383.3333333333333" y="393" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="423">Transaction</text><text class="count" x="395.3333333333333" y="451">2: request 1, reply 2</text><rect x="736.6666666666666" y="393" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="423">Status</text><text class="count" x="748.6666666666666" y="451">2: success = 0</text><text class="label" x="30" y="512">Association request</text><rect x="30" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="555">Capability</text><text class="count" x="42" y="583">2</text><rect x="383.3333333333333" y="525" width="346.3333333333333" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="395.3333333333333" y="555">Listen interval</text><text class="count" x="395.3333333333333" y="583">2</text><rect x="736.6666666666666" y="525" width="346.3333333333333" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="748.6666666666666" y="555">Elements</text><text class="count" x="748.6666666666666" y="583">SSID, rates, RSN</text><text class="label" x="30" y="644">Reassociation request</text><rect x="30" y="657" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="687">Capability</text><text class="count" x="42" y="715">2</text><rect x="295" y="657" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="687">Listen interval</text><text class="count" x="307" y="715">2</text><rect x="560" y="657" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="687">Previous AP</text><text class="count" x="572" y="715">6</text><rect x="825" y="657" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="687">Elements</text><text class="count" x="837" y="715">variable</text><text class="label" x="30" y="776">Association / reassociation response</text><rect x="30" y="789" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="819">Capability</text><text class="count" x="42" y="847">2</text><rect x="295" y="789" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="307" y="819">Status</text><text class="count" x="307" y="847">2</text><rect x="560" y="789" width="258" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="572" y="819">Association ID</text><text class="count" x="572" y="847">2</text><rect x="825" y="789" width="258" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="837" y="819">Elements</text><text class="count" x="837" y="847">rates, RSN</text><text class="label" x="30" y="908">Disassociation / deauthentication</text><rect x="30" y="921" width="523" height="77" rx="3" fill="#f1f3f4" stroke="#a99b8c"/><text class="field" x="42" y="951">Reason code</text><text class="count" x="42" y="979">2</text><rect x="560" y="921" width="523" height="77" rx="3" fill="#faf2e7" stroke="#a99b8c"/><text class="field" x="572" y="951">Following fields</text><text class="count" x="572" y="979">if present</text></svg>
