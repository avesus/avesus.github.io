<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#07151d"/><g font-family="Arial,sans-serif" fill="#e6f3f3"><text x="66" y="88" font-size="23" fill="#79e8bd">GREENFOREST · RF / DSP / C++</text><text x="66" y="182" font-size="59" font-weight="700">A WPA2 access point</text><text x="66" y="252" font-size="59" font-weight="700">you can take apart.</text><text x="66" y="322" font-size="29" fill="#a8bdc6">From I/Q samples to an actual client's HTML page.</text><path d="M66 370H1134" stroke="#29444d" stroke-width="2"/><text x="66" y="435" font-size="36" fill="#79e8bd">I/Q → frames → keys → IP → TCP → HTML</text><text x="66" y="514" font-size="31" font-weight="700">2,774 LUTs · 5,185 FF · zero DSP blocks</text><text x="66" y="564" font-size="24" fill="#a8bdc6">Full source. Portable protocol. Explicit timing boundaries.</text></g></svg>
