<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Why Wi-Fi needs a real-time radio</title><desc id="desc">A received frame ends, a ten microsecond gap passes, and an acknowledgment starts. The article follows this deadline through an FPGA and the complete C++ access point.</desc>
<rect width="1200" height="630" fill="#faf8f2"/>
<g font-family="Arial,sans-serif" fill="#111">
<text x="66" y="80" font-size="23" fill="#520">GREENFOREST · RF / DSP / C++</text>
<text x="66" y="176" font-size="64" font-weight="700">Why Wi-Fi needs</text>
<text x="66" y="253" font-size="64" font-weight="700">a real-time radio</text>
<text x="66" y="314" font-size="28" fill="#444">From GNU Radio's ACK deadline to a complete access point.</text>
<path d="M66 414H1134" stroke="#777" stroke-width="2"/>
<rect x="66" y="383" width="360" height="62" fill="#dce6ed"/><text x="91" y="423" font-size="27" fill="#17394e">Received Wi-Fi frame</text>
<path d="M426 367V461M740 367V461" stroke="#9a2d21" stroke-width="2" stroke-dasharray="6 5"/>
<text x="583" y="423" text-anchor="middle" font-size="33" font-weight="700" fill="#9a2d21">10 µs</text>
<rect x="740" y="383" width="394" height="62" fill="#e8efe6"/><text x="767" y="423" font-size="27" fill="#1a492b">ACK starts here</text>
<text x="66" y="526" font-size="28">I/Q → frames → WPA2 → IP → TCP → HTML</text>
<text x="66" y="575" font-size="24" fill="#444">The timing, the packet state and the complete C++ / RTL source.</text>
</g></svg>
