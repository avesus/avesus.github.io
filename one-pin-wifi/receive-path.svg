<text x="60" y="66" font-size="38" font-weight="700">Wi-Fi through one FPGA input</text><text x="60" y="105" font-size="22">Measured receive path · no external LNA · Brian Greenforest</text>
<g fill="white" stroke="#91b5a6" stroke-width="2"><rect x="55" y="160" width="250" height="130" rx="12"/><rect x="400" y="160" width="280" height="130" rx="12"/><rect x="795" y="160" width="540" height="320" rx="12"/><rect x="795" y="630" width="540" height="160" rx="12"/><rect x="55" y="420" width="535" height="160" rx="12"/></g>
<text x="78" y="201" font-size="27" font-weight="600">ESP8266 test AP</text><text x="78" y="238" font-size="22">Channel 6 · 2,437 MHz</text><text x="78" y="272" font-size="22">HITL-RX-TEST</text>
<text x="425" y="201" font-size="27" font-weight="600">Antenna + moRFeus</text><text x="425" y="238" font-size="22">LO: 2,370 MHz</text><text x="425" y="272" font-size="22">Mixer current setting: 1</text>
<path d="M305 220 H385 M680 220 H775" fill="none" stroke="#146b83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="196" font-size="20">air</text><text x="700" y="194" font-size="20">67 MHz</text>
<text x="823" y="201" font-size="27" font-weight="600">pico-ice · iCE40UP5K</text><text x="823" y="243" font-size="22">RF → coupling capacitor → pad 3</text><text x="823" y="281" font-size="22">One differential threshold input</text><text x="823" y="319" font-size="22">Reference pad 4 → 47 µF → ground</text><text x="823" y="365" font-size="22">Rolling ones density → capacitor control</text><text x="823" y="402" font-size="22">Weak charging + short sink pulses</text><text x="823" y="451" font-size="23" font-weight="600">408 Mdecision/s nominal · full-band capture</text>
<text x="80" y="461" font-size="25" font-weight="600">Existing reference circuit</text><text x="80" y="503" font-size="22">3.3 V → 470 Ω → 1.240 V shunt reference</text><text x="80" y="545" font-size="22">1.240 V → 100 kΩ → RF pad bias</text>
<path d="M590 500 H730 V263 H780" fill="none" stroke="#146b83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1065 480 V614" fill="none" stroke="#146b83" stroke-width="3" marker-end="url(#arrow)"/><text x="1090" y="535" font-size="21">Retained RF record</text><text x="1090" y="568" font-size="21">USB transfer to PC</text>
<text x="823" y="674" font-size="27" font-weight="600">Host Wi-Fi decoder</text><text x="823" y="716" font-size="22">24 MHz selection → Barker → DBPSK</text><text x="823" y="753" font-size="22">Descramble → PHY CRC → MAC frame + FCS</text>
<text x="60" y="676" font-size="25" font-weight="600">FPGA controls its own threshold.</text><text x="60" y="718" font-size="22">Target: ~65% ones · generator off</text><text x="60" y="754" font-size="22">Package pin numbers; common circuit ground.</text></g></svg>