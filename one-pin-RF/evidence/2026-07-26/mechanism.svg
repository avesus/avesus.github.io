<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="610" viewBox="0 0 1720 610" role="img" aria-labelledby="title desc">
  <title id="title">The complete one-pin transmitter and observation path</title>
  <desc id="desc">Complete complex baseband becomes signed I and Q sigma-delta streams, whole-word rotation, four phase selection, a switched N16 boundary, and essential resonant matter. Receiver I and Q and direct FPGA telemetry remain separate observations until host-time association.</desc>
  <style>
    .title { font: 700 42px Georgia, serif; fill: #102b20; }
    .subtitle { font: 22px Georgia, serif; fill: #3e4b44; }
    .label { font: 700 22px Arial, sans-serif; fill: #102b20; }
    .body { font: 20px Arial, sans-serif; fill: #263c31; }
    .small { font: 17px Arial, sans-serif; fill: #4e6257; }
    .mono { font: 18px Consolas, monospace; fill: #203c2e; }
    .metric { font: 700 34px Arial, sans-serif; fill: #234f39; }
  </style>
  <rect width="1720" height="610" fill="#fbfcfa"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#416b55"/></marker></defs>
  <text x="50" y="72" class="title">The complete path, without an external I/Q mixer</text>
  <text x="50" y="112" class="subtitle">The FPGA creates RF phase selection; the passive network remains part of the transmitter.</text>
<g>
          <rect x="50" y="205" width="230" height="190" rx="18" fill="#f3f6f2" stroke="#416b55" stroke-width="3"/>
          <text x="165" y="275" class="label" text-anchor="middle"><tspan x="165" dy="0">Complete</tspan><tspan x="165" dy="36">complex baseband</tspan></text>
          <path d="M 280 300 H 315" stroke="#416b55" stroke-width="5" marker-end="url(#arrow)"/>
        </g>
<g>
          <rect x="325" y="205" width="230" height="190" rx="18" fill="#f3f6f2" stroke="#416b55" stroke-width="3"/>
          <text x="440" y="275" class="label" text-anchor="middle"><tspan x="440" dy="0">Signed I/Q</tspan><tspan x="440" dy="36">one-bit SDMs</tspan></text>
          <path d="M 555 300 H 590" stroke="#416b55" stroke-width="5" marker-end="url(#arrow)"/>
        </g>
<g>
          <rect x="600" y="205" width="230" height="190" rx="18" fill="#f3f6f2" stroke="#416b55" stroke-width="3"/>
          <text x="715" y="275" class="label" text-anchor="middle"><tspan x="715" dy="0">+7.5 MHz</tspan><tspan x="715" dy="36">whole-word rotation</tspan></text>
          <path d="M 830 300 H 865" stroke="#416b55" stroke-width="5" marker-end="url(#arrow)"/>
        </g>
<g>
          <rect x="875" y="205" width="230" height="190" rx="18" fill="#f3f6f2" stroke="#416b55" stroke-width="3"/>
          <text x="990" y="275" class="label" text-anchor="middle"><tspan x="990" dy="0">Four phases</tspan><tspan x="990" dy="36">at 216 MHz</tspan></text>
          <path d="M 1105 300 H 1140" stroke="#416b55" stroke-width="5" marker-end="url(#arrow)"/>
        </g>
<g>
          <rect x="1150" y="205" width="230" height="190" rx="18" fill="#e7efe9" stroke="#416b55" stroke-width="3"/>
          <text x="1265" y="275" class="label" text-anchor="middle"><tspan x="1265" dy="0">N16</tspan><tspan x="1265" dy="36">high / high-Z</tspan></text>
          <path d="M 1380 300 H 1415" stroke="#416b55" stroke-width="5" marker-end="url(#arrow)"/>
        </g>
<g>
          <rect x="1425" y="205" width="230" height="190" rx="18" fill="#f3f6f2" stroke="#416b55" stroke-width="3"/>
          <text x="1540" y="275" class="label" text-anchor="middle"><tspan x="1540" dy="0">Essential</tspan><tspan x="1540" dy="36">resonant tank</tspan></text>

        </g>
  <path d="M 715 395 V 455" fill="none" stroke="#879a90" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="360" y="455" width="340" height="92" rx="16" fill="#fff" stroke="#879a90" stroke-width="2"/>
  <text x="530" y="493" class="body" text-anchor="middle"><tspan x="530" dy="0">Direct FPGA telemetry</tspan><tspan x="530" dy="27">internal symbol epochs</tspan></text>
  <path d="M 1540 395 V 455" fill="none" stroke="#879a90" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="1180" y="455" width="430" height="92" rx="16" fill="#fff" stroke="#879a90" stroke-width="2"/>
  <text x="1395" y="493" class="body" text-anchor="middle"><tspan x="1395" dy="0">Nominal 3 dB pad + RTL-SDR</tspan><tspan x="1395" dy="27">retained receiver I/Q</tspan></text>
  <path d="M 700 501 H 740" stroke="#879a90" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1180 501 H 1140" stroke="#879a90" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="740" y="455" width="400" height="92" rx="16" fill="#eef4ef" stroke="#416b55" stroke-width="2"/>
  <text x="940" y="493" class="body" text-anchor="middle"><tspan x="940" dy="0">Host-time + burst-edge association</tspan><tspan x="940" dy="27">independent clocks; no shared trigger</tspan></text>
</svg>
