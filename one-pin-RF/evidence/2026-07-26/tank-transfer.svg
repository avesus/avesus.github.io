    .metric { font: 700 34px Arial, sans-serif; fill: #234f39; }
  </style>
  <rect width="1400" height="850" fill="#fbfcfa"/>
  <text x="60" y="62" class="title">The resonant tank is essential matter, not decoration</text>
  <text x="60" y="102" class="subtitle">Five repeated complex S21 sweeps at the existing user calibration plane.</text>
