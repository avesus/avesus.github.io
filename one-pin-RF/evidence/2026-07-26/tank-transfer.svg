<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Five repeated passive resonant-tank S21 sweeps</title>
  <desc id="desc">Five complex S21 sweeps show the tank transfer peak, half-power bandwidth, and final wanted lane near the upper half-power edge.</desc>
