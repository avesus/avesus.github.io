<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970" role="img" aria-labelledby="title desc">
  <title id="title">Measured limits of the one-pin transmitter</title>
  <desc id="desc">A setting with better raw spectral separation failed its frame, denser PSK packets produced finite errors, one PLL delay tap traded image against carrier, and the wide waveform was not flat.</desc>
  <style>
    .title { font: 700 42px Georgia, serif; fill: #102b20; }
    .subtitle { font: 22px Georgia, serif; fill: #3e4b44; }
    .label { font: 700 22px Arial, sans-serif; fill: #102b20; }
    .body { font: 20px Arial, sans-serif; fill: #263c31; }
    .small { font: 17px Arial, sans-serif; fill: #4e6257; }
    .mono { font: 18px Consolas, monospace; fill: #203c2e; }
    .metric { font: 700 34px Arial, sans-serif; fill: #234f39; }
  </style>
  <rect width="1500" height="970" fill="#fbfcfa"/>
  <text x="60" y="62" class="title">A prettier spectrum can carry the wrong message</text>
  <text x="60" y="102" class="subtitle">Information recovery, image, carrier, and passband shape are separate axes.</text>
  <rect x="60" y="145" width="660" height="330" rx="20" fill="#eef4ef" stroke="#b8c9bd"/>
  <text x="95" y="195" class="label">Accepted 8PSK setting</text>
  <text x="95" y="250" class="metric">20.583 dB</text>
  <text x="95" y="286" class="body">raw equal-window separation</text>
  <text x="95" y="345" class="metric">7.265%</text>
  <text x="95" y="381" class="body">decision-referenced EVM</text>
  <text x="95" y="435" class="label" fill="#2f6b4a">FRAME PASSED</text>
  <rect x="780" y="145" width="660" height="330" rx="20" fill="#f8eeee" stroke="#d5b6b2"/>
  <text x="815" y="195" class="label">Rejected 8PSK setting</text>
  <text x="815" y="250" class="metric" fill="#8e3f3a">23.745 dB</text>
  <text x="815" y="286" class="body">better-looking raw separation</text>
  <text x="815" y="345" class="metric" fill="#8e3f3a">96.152%</text>
  <text x="815" y="381" class="body">decision-referenced EVM</text>
  <text x="815" y="435" class="label" fill="#8e3f3a">FRAME FAILED</text>
  <rect x="60" y="515" width="430" height="360" rx="20" fill="#f5f7f4" stroke="#c7d1ca"/>
  <text x="95" y="565" class="label">Finite density boundary</text>
  <text x="95" y="620" class="body" text-anchor="start"><tspan x="95" dy="0">8PSK: 0/2040 wrong bits</tspan><tspan x="95" dy="47">16PSK A: 1/2040</tspan><tspan x="95" dy="47">16PSK B: 0/2040</tspan><tspan x="95" dy="47">32PSK: 5/2040</tspan></text>
  <text x="95" y="830" class="small">Individual retained packets, not a BER curve.</text>
  <rect x="535" y="515" width="430" height="360" rx="20" fill="#f5f7f4" stroke="#c7d1ca"/>
  <text x="570" y="565" class="label">One nominal PLL delay tap</text>
  <text x="570" y="645" class="metric">+5.235 dB</text>
  <text x="570" y="680" class="body">wanted / true image</text>
  <text x="570" y="755" class="metric" fill="#8e3f3a">-0.763 dB</text>
  <text x="570" y="790" class="body">wanted / carrier</text>
  <text x="570" y="830" class="small">Better image, worse carrier.</text>
  <rect x="1010" y="515" width="430" height="360" rx="20" fill="#f5f7f4" stroke="#c7d1ca"/>
  <text x="1045" y="565" class="label">Wide-waveform boundary</text>
  <text x="1045" y="645" class="metric">18.888 dB</text>
  <text x="1045" y="680" class="body">flat-core spread</text>
  <text x="1045" y="755" class="metric" fill="#8e3f3a">+11.403 dB</text>
  <text x="1045" y="790" class="body">216 MHz term vs desired</text>
  <text x="1045" y="830" class="small">Sequential, non-de-embedded views.</text>
  <text x="60" y="930" class="small">All spectral levels are receiver-relative. No panel claims calibrated dBm, pure image rejection, or a complete emissions scan.</text>
</svg>
