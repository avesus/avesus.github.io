<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc"><title id="title">Two MDB-44H+ mixers</title><desc id="desc">One low-band input is upconverted and downconverted with two 20 GHz LOs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#426454"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#252a24}.label{font-family:monospace;font-size:17px}.small{font-size:16px}.wire{fill:none;stroke:#426454;stroke-width:2.5;marker-end:url(#arrow)}.clock{fill:none;stroke:#986b38;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#718775;stroke-width:1.5}.filter{fill:#f0e8d8;stroke:#aa9875;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fbf8f0"/><text x="35" y="42" font-size="25" font-weight="bold">Dual MDB-44H+: upconvert, then downconvert</text><text x="35" y="71" font-size="18">2 × $18 = $36 in mixer cores · one physical input</text>
<text x="35" y="181" class="label">100–600</text><text x="35" y="204" class="label">MHz in</text><path class="wire" d="M130 190 H185"/>
<rect class="box" x="190" y="151" width="150" height="82" rx="7"/><text x="265" y="180" text-anchor="middle" font-size="20" font-weight="bold">M1</text><text x="265" y="206" text-anchor="middle" class="label">IF → RF</text><text x="265" y="115" text-anchor="middle" class="label">LO1: 20 GHz</text><path class="clock" d="M265 124 V147"/>
<path class="wire" d="M340 190 H450"/><text x="395" y="263" text-anchor="middle" class="label">20.1–20.6 GHz</text>
<rect class="filter" x="455" y="151" width="185" height="82" rx="7"/><text x="547" y="182" text-anchor="middle" font-size="19">Select translated</text><text x="547" y="207" text-anchor="middle" font-size="19">band / gain</text><path class="wire" d="M640 190 H720"/>
<rect class="box" x="725" y="151" width="150" height="82" rx="7"/><text x="800" y="180" text-anchor="middle" font-size="20" font-weight="bold">M2</text><text x="800" y="206" text-anchor="middle" class="label">RF → IF</text><text x="800" y="115" text-anchor="middle" class="label">LO2: 20 GHz</text><path class="clock" d="M800 124 V147"/>
<path class="wire" d="M875 190 H955"/><text x="970" y="181" class="label">100–600</text><text x="970" y="204" class="label">MHz out</text>
<text x="35" y="320" font-size="18">Then: IF filtering → adjustable gain / threshold → 4f sampling → digital I/Q</text><text x="35" y="347" class="small">Both LOs and RF ports stay within 10–40 GHz. The original low band enters M1 at IF.</text></svg>