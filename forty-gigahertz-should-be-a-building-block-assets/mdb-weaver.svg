<text x="35" y="459" font-size="18">Wanted upper RF band adds. Its 12–12.5 GHz first-stage image cancels in the ideal sum.</text><text x="35" y="489" class="small">LO phase signs shown match the article’s equation. Matching and filtering set actual image rejection.</text><text x="35" y="518" class="small">Microwave IF connects to the second pair’s RF ports; no MDB LO is operated below 10 GHz.</text></svg>